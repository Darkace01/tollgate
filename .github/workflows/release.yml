name: Release

# Push a tag like v1.0.1 (matching package.json "version") to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm test
      - run: npx vsce package --no-dependencies -o tollgate.vsix
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies --packagePath tollgate.vsix
      - name: Publish to Open VSX (Cursor, VSCodium, Windsurf…)
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish tollgate.vsix
      - name: Upload .vsix to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: tollgate.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
