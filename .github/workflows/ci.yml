name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: '*.vsix'

  visualstudio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm ci
      - run: npm run build
      - name: Tollgate.Core tests (against the real runner)
        run: dotnet run --project visualstudio/tests/Tollgate.Core.Tests -c Release -- dist/cli.js
      - uses: microsoft/setup-msbuild@v2
      - name: Build the Visual Studio extension
        run: msbuild visualstudio/src/Tollgate.VisualStudio/Tollgate.VisualStudio.csproj /restore /p:Configuration=Release /v:minimal
      - uses: actions/upload-artifact@v7
        with:
          name: tollgate-visualstudio-vsix
          path: visualstudio/src/Tollgate.VisualStudio/bin/Release/*.vsix
